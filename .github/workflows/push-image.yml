name: Build and Push Docker Image

on:
  workflow_dispatch:

env:
  SOURCE_FOLDER: src
  IMAGE_NAME: rinha-de-backend-2026-dotnet-csharp-with-faiss-interop

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          cd ${{ env.SOURCE_FOLDER }}
          docker compose build

      - name: Tag image
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          REPO=ghcr.io/${{ github.repository_owner }}

          docker tag ${{ env.IMAGE_NAME }} $REPO/${{ env.IMAGE_NAME }}:$TIMESTAMP
          docker tag ${{ env.IMAGE_NAME }} $REPO/${{ env.IMAGE_NAME }}:latest

          echo "Tagged image"

      - name: Push image
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          REPO=ghcr.io/${{ github.repository_owner }}

          docker push $REPO/${{ env.IMAGE_NAME }}:latest
          docker push $REPO/${{ env.IMAGE_NAME }}:$TIMESTAMP

          echo "TIMESTAMP TAG=$TIMESTAMP"